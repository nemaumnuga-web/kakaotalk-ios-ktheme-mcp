[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kakaotalk-ios-ktheme-mcp"
version = "0.1.0"
description = "한국어 우선 iOS 카카오톡 .ktheme 기술 개발 MCP 서버 (디자인 비개입)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]
license = "MIT"
keywords = ["kakaotalk", "ios", "ktheme", "mcp", "korean", "theme-validator"]

[project.scripts]
ktheme-mcp = "ktheme_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ktheme_mcp = ["knowledge/*.md"]
